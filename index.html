<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Ikinci el bisiklet karar tahtasi">
<title>Blocket Karar Tahtasi</title>
</head>
<body>
<style id="appcss">/* Blocket Karar Tahtasi — palet: soguk arduvaz + reflektor kehribar (E0700A),
   bisiklet jantlarindaki turuncu reflektorden alindi. Tipografi: Archivo (baslik/
   etiket) · IBM Plex Sans (govde) · IBM Plex Mono (sayi). */
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --surface2:#EAEEF1; --raised:#FFFFFF;
  --ink:#111820; --ink2:#37424E; --muted:#5F6C7A; --line:#D8DEE4; --line2:#C3CCD5;
  --accent:#D2670A; --accent-soft:#FBEEE1; --on-accent:#FFFFFF;
  --good:#15694A; --good-soft:#E2F0EA;
  --warn:#8C6108; --warn-soft:#F7EEDA;
  --bad:#A0362A;  --bad-soft:#F7E5E2;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 6px 20px rgba(16,24,32,.06);
  --r:9px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1115; --surface:#151A20; --surface2:#1B222A; --raised:#1B222A;
    --ink:#E5EAEF; --ink2:#C2CBD4; --muted:#8896A4; --line:#242D36; --line2:#313C47;
    --accent:#F08A2E; --accent-soft:#2A1E12; --on-accent:#14100A;
    --good:#4FBF92; --good-soft:#12251E;
    --warn:#D9A63A; --warn-soft:#251E10;
    --bad:#E4776A;  --bad-soft:#261614;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1115; --surface:#151A20; --surface2:#1B222A; --raised:#1B222A;
  --ink:#E5EAEF; --ink2:#C2CBD4; --muted:#8896A4; --line:#242D36; --line2:#313C47;
  --accent:#F08A2E; --accent-soft:#2A1E12; --on-accent:#14100A;
  --good:#4FBF92; --good-soft:#12251E;
  --warn:#D9A63A; --warn-soft:#251E10;
  --bad:#E4776A;  --bad-soft:#261614;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
#app{max-width:1560px;margin:0 auto;padding:0 14px 80px}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif;margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:Archivo,sans-serif;font-size:10px;font-weight:600;letter-spacing:.09em;
     text-transform:uppercase;color:var(--muted)}

/* ---------- ust bar ---------- */
header{position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 0 0;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.015em}
.brand .sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tab{padding:8px 16px;border-radius:var(--r) var(--r) 0 0;border:1px solid transparent;
  border-bottom:none;font-family:Archivo,sans-serif;font-weight:600;font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);
  box-shadow:inset 0 2px 0 var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:10px 0;border-top:1px solid var(--line);margin-top:-1px}
input[type=search],select{background:var(--surface);border:1px solid var(--line2);
  border-radius:6px;padding:6px 9px;font:inherit;font-size:13px;color:var(--ink);min-width:0}
input[type=search]{flex:1 1 180px;max-width:280px}
.chip{padding:5px 11px;border:1px solid var(--line2);border-radius:99px;font-size:12px;
  font-weight:500;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ---------- ozet ---------- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;
  letter-spacing:-.02em;margin-top:2px}
.stat .hint{font-size:11px;color:var(--muted);margin-top:1px}

/* ---------- bolum basligi ---------- */
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 9px}
.sec h2{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.sec .rule{flex:1;height:1px;background:var(--line)}
.sec .cnt{font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.sec.arch{margin-top:34px}
.sec.arch h2{color:var(--muted)}

/* ---------- tablo ---------- */
.twrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:1180px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface2);text-align:left;
  padding:8px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;
  font-family:Archivo,sans-serif;font-size:10px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted)}
thead th.s{cursor:pointer;user-select:none}
thead th.s:hover{color:var(--ink)}
thead th .ar{color:var(--accent);margin-left:3px}
tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
tbody tr.sold td:not(.c-yorum){opacity:.5}
td{padding:7px 9px;vertical-align:middle}
td.c-foto{width:52px;padding:5px 6px}
td.c-foto img{width:44px;height:34px;object-fit:cover;border-radius:5px;
  border:1px solid var(--line);display:block;background:var(--surface2)}
.noimg{width:44px;height:34px;border-radius:5px;border:1px dashed var(--line2);
  display:grid;place-items:center;font-size:9px;color:var(--muted)}
td.c-ad{min-width:210px}
.ad-name{font-weight:600;letter-spacing:-.005em;display:block}
.ad-meta{font-size:11px;color:var(--muted);margin-top:1px}
.ad-meta a{color:var(--accent);text-decoration:none;font-weight:500}
.ad-meta a:hover{text-decoration:underline}
.puan{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}
.aralik{font-size:10px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600;
  font-family:Archivo,sans-serif;letter-spacing:.02em;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--surface2);color:var(--muted)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.fark{font-family:"IBM Plex Mono",monospace;font-weight:600}
.fark.pos{color:var(--good)} .fark.neg{color:var(--bad)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.d-var{background:var(--good)} .d-yok{background:var(--line2)}
.c-yorum{min-width:190px;max-width:260px}
.yorum-box{width:100%;background:transparent;border:1px dashed var(--line2);border-radius:6px;
  padding:5px 7px;font:inherit;font-size:12px;color:var(--ink);resize:vertical;min-height:32px}
.yorum-box:focus{background:var(--surface2);border-style:solid;border-color:var(--accent)}
.yorum-box::placeholder{color:var(--muted);opacity:.7}
.yorum-box.dolu{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}

/* ---------- mobil kart ---------- */
.cards{display:none;flex-direction:column;gap:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:11px;box-shadow:var(--shadow)}
.card.sold{opacity:.6}
.card-top{display:flex;gap:10px}
.card-top img,.card-top .noimg{width:76px;height:58px;flex:none;object-fit:cover;border-radius:6px;
  border:1px solid var(--line)}
.card-hd{flex:1;min-width:0}
.card-hd .ad-name{font-size:14px}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px;
  padding-top:9px;border-top:1px solid var(--line)}
.card-grid div{min-width:0}
.card-grid .v{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;
  margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- detay cekmecesi ---------- */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,14,18,.5);backdrop-filter:blur(2px)}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--surface);
  border-left:1px solid var(--line);overflow-y:auto;padding:18px 20px 60px;box-shadow:var(--shadow)}
.panel h3{font-size:17px;font-weight:700;letter-spacing:-.015em;padding-right:36px}
.close{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:6px;
  border:1px solid var(--line2);display:grid;place-items:center;font-size:16px;color:var(--muted)}
.close:hover{background:var(--surface2);color:var(--ink)}
.panel .hero{width:100%;max-height:230px;object-fit:cover;border-radius:8px;border:1px solid var(--line);
  margin:12px 0 4px;background:var(--surface2)}
.grp{margin-top:18px}
.grp>.lbl{padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:8px;display:block}
.kv{display:grid;grid-template-columns:112px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;font-weight:500}
.eksik{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);
  padding:9px 11px;margin-top:14px;font-size:12.5px;color:var(--warn)}
.eksik b{font-family:Archivo,sans-serif;display:block;margin-bottom:3px;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase}
.notes{font-size:12px;line-height:1.65;color:var(--ink2);background:var(--surface2);
  border-radius:var(--r);padding:11px 12px;white-space:pre-wrap;word-break:break-word;
  max-height:290px;overflow-y:auto}
.panel textarea.yorum-box{min-height:88px;font-size:13px}
.saveline{display:flex;align-items:center;gap:9px;margin-top:9px}
.btn{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:7px 15px;font-weight:600;
  font-family:Archivo,sans-serif;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.savemsg{font-size:12px;color:var(--muted)}
.savemsg.ok{color:var(--good)} .savemsg.err{color:var(--bad)}

footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.7}
footer code{font-family:"IBM Plex Mono",monospace;background:var(--surface2);padding:1px 5px;border-radius:4px}

@media (max-width:900px){
  #app{padding:0 10px 70px}
  .twrap{display:none}
  .cards{display:flex}
  .brand h1{font-size:17px}
  .panel{width:100%;border-left:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

   (canli DOM degil), yorumlar #yorum bloguna gomulur, artifact.publish ayni URL'e basar. */
(function () {
  "use strict";

  var BIKES = JSON.parse(document.getElementById("bikes").textContent);
  var YORUM = JSON.parse(document.getElementById("yorum").textContent || "{}");
  function yorumlariUygula() { BIKES.forEach(function (b) { if (YORUM[b.anahtar]) b.yorum = YORUM[b.anahtar]; }); }

  yorumlariUygula();

  var S = { profil: "A", q: "", durum: "aday", sort: "puan", dir: -1, acik: null };
  var NS = null, kirli = false, zaman = null;
  // GitHub Pages'te claude runtime YOK. O zaman yorumlar bu cihazin localStorage'ina
  // yazilir; "Yorumlari disari aktar" ile JSON alinip yorum.json'a islenir.
  var YAS_NOT = "Blocket ilanin ILK YAYIN tarihini vermiyor; yalniz 'Senast andrad' (son duzenleme) var. Bu sayi son duzenlemeden bu yana gecen gundur - satici ilani guncellerse SIFIRLANIR. Tek yonlu sinyal: buyuk sayi kesin bayat demektir, kucuk sayi taze olmayabilir.";
  var LS = "bisiklet-yorum-v1";
  var yerel = (function () {
    try { return window.localStorage ? JSON.parse(localStorage.getItem(LS) || "{}") : null; }
    catch (e) { return null; }
  })();
  if (yerel) { for (var k in yerel) if (yerel[k]) YORUM[k] = yerel[k]; }
  yorumlariUygula();

  /* ---------- yardimcilar ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function kr(n) { return n == null ? "—" : new Intl.NumberFormat("sv-SE").format(n) + " kr"; }
  function km(n) { return n == null ? "—" : (n % 1 === 0 ? n : n.toFixed(1)) + " km"; }
  function bosluk(v) { return v === "" || v == null ? "—" : v; }
  function nokta(v) {
    if (v === "var" || (typeof v === "string" && v.indexOf("var") === 0))
      return '<span class="dot d-var"></span>' + esc(v === "var" ? "var" : v.slice(4).replace(/^[( ]+|\)$/g, "") || "var");
    if (v === "yok") return '<span class="dot d-yok"></span>yok';
    return '<span style="color:var(--muted)">—</span>';
  }
  var DURUM_ETIKET = { aday: "aday", satildi: "satıldı", vazgecildi: "vazgeçildi", elendi: "elendi" };
  var DURUM_SINIF = { aday: "p-good", satildi: "p-mute", vazgecildi: "p-mute", elendi: "p-bad" };

  function guvenPill(g) {
    if (g === "" || g == null) return '<span class="pill p-mute">?</span>';
    var n = +g, c = n >= 8 ? "p-good" : n >= 6 ? "p-warn" : "p-bad";
    return '<span class="pill ' + c + '">' + n + "/10</span>";
  }
  function farkHtml(d) {
    if (d.fark == null) return '<span style="color:var(--muted)">—</span>';
    var s = d.fark > 0 ? "+" : "";
    return '<span class="fark ' + (d.fark >= 0 ? "pos" : "neg") + '">' + s + new Intl.NumberFormat("sv-SE").format(d.fark) + "</span>";
  }
  function vitesHtml(d) {
    if (!d.vites_n && !d.vites_tip) return '<span style="color:var(--muted)">—</span>';
    var t = d.vites_tip === "ic_gobek" ? "iç göbek" : d.vites_tip === "dis_aktarma" ? "dış" : d.vites_tip || "";
    var sv = d.vites_seviye ? '<div class="ad-meta">' + esc(d.vites_seviye) + "</div>" : "";
    return "<b>" + esc(d.vites_n || "?") + "</b> <span style=\"color:var(--muted);font-size:11px\">" + esc(t) + "</span>" + sv;
  }

  /* ---------- sutunlar ---------- */
  var COLS = [
    { k: "foto", t: "", cls: "c-foto", sort: false, td: function (d) {
        return d.foto_url ? '<img src="' + esc(d.foto_url) + '" alt="" loading="lazy">'
                          : '<div class="noimg">yok</div>'; } },
    { k: "ad", t: "Ad · marka model", cls: "c-ad", v: function (d) { return d.ad.toLowerCase(); }, td: function (d) {
        return '<span class="ad-name">' + esc(d.ad) + "</span>" +
          '<span class="ad-meta"><a href="' + esc(d.link) + '" target="_blank" rel="noopener" ' +
          'onclick="event.stopPropagation()">ilan ' + esc(d.id) + " ↗</a>" +
          (d.renk ? " · " + esc(d.renk) : "") + "</span>"; } },
    { k: "puan", t: "Puan", v: function (d) { return d.puan; }, td: function (d) {
        return '<span class="puan">' + d.puan.toFixed(1) + "</span>" +
          (d.kapsama < 100 ? '<div class="aralik">' + d.alt.toFixed(0) + "–" + d.ust.toFixed(0) + "</div>"
                           : '<div class="aralik">kesin</div>'); } },
    { k: "fiyat", t: "Fiyat", v: function (d) { return d.toplam == null ? 1e9 : d.toplam; }, td: function (d) {
        return '<span class="num">' + kr(d.toplam) + "</span>" +
          (d.ek_maliyet ? '<div class="ad-meta">+' + d.ek_maliyet + " ek</div>" : ""); } },
    { k: "deger", t: "Değer", v: function (d) { return d.deger == null ? -1 : d.deger; },
      td: function (d) { return '<span class="num">' + kr(d.deger) + "</span>"; } },
    { k: "fark", t: "Fark", v: function (d) { return d.fark == null ? -1e9 : d.fark; }, td: farkHtml },
    { k: "mesafe", t: "Mesafe", v: function (d) { return d.mesafe == null ? 1e9 : d.mesafe; },
      td: function (d) { return '<span class="num">' + km(d.mesafe) + "</span>"; } },
    { k: "yer", t: "Yer · gün", v: function (d) { return (d.yer || "zzz").toLowerCase(); }, td: function (d) {
        var g = d.ilan_yas;
        var sn = g == null ? "p-mute" : g > 45 ? "p-bad" : g > 21 ? "p-warn" : "p-mute";
        return '<span style="font-size:12px">' + esc(bosluk(d.yer)) + "</span>" +
          (g == null ? '<div class="ad-meta">gün ?</div>'
                     : '<div class="ad-meta"><span class="pill ' + sn + '">' + g + " gün</span></div>"); } },
    { k: "size", t: "Beden", v: function (d) { return d.size || "zz"; },
      td: function (d) { return '<span class="num">' + esc(bosluk(d.size)) + "</span>"; } },
    { k: "kadro", t: "Kadro", v: function (d) { return d.kadro_tip || "zz"; },
      td: function (d) { return '<span style="font-size:12px">' + esc(bosluk(d.kadro_tip)) + "</span>"; } },
    { k: "yil", t: "Yıl", v: function (d) { return d.yil || "zz"; },
      td: function (d) { return '<span class="num">' + esc(bosluk(d.yil)) + "</span>"; } },
    { k: "vites", t: "Vites", v: function (d) { return +d.vites_n || 0; }, td: vitesHtml },
    { k: "fren", t: "Fren", v: function (d) { return d.fren || "zz"; },
      td: function (d) { return '<span style="font-size:12px">' + esc(bosluk(d.fren)) + "</span>"; } },
    { k: "guven", t: "Güven", v: function (d) { return d.guven === "" ? -1 : +d.guven; },
      td: function (d) { return guvenPill(d.guven); } },
    { k: "durum", t: "Durum", v: function (d) { return d.durum; }, td: function (d) {
        return '<span class="pill ' + DURUM_SINIF[d.durum] + '">' + DURUM_ETIKET[d.durum] + "</span>"; } },
    { k: "yorum", t: "Yorumun", cls: "c-yorum", sort: false, td: function (d) {
        return '<textarea class="yorum-box' + (d.yorum ? " dolu" : "") + '" rows="1" data-k="' +
          esc(d.anahtar) + '" placeholder="içgüdün ne diyor?" onclick="event.stopPropagation()">' +
          esc(d.yorum) + "</textarea>"; } }
  ];

  /* ---------- veri secimi ---------- */
  function suzulmus() {
    var q = S.q.trim().toLowerCase();
    return BIKES.filter(function (d) {
      if (d.profil !== S.profil) return false;
      if (S.durum !== "hepsi" && d.durum !== S.durum) return false;
      if (!q) return true;
      return (d.ad + " " + d.id + " " + d.renk + " " + d.fren + " " + d.kadro_tip + " " + d.yer + " " +
              d.satici + " " + d.yorum + " " + d.not_tam).toLowerCase().indexOf(q) >= 0;
    });
  }
  function sirala(list) {
    var c = COLS.filter(function (x) { return x.k === S.sort; })[0];
    if (!c || !c.v) return list;
    return list.slice().sort(function (a, b) {
      var x = c.v(a), y = c.v(b);
      if (x < y) return -S.dir; if (x > y) return S.dir; return 0;
    });
  }

  /* ---------- gorunumler ---------- */
  function tabloHtml(rows) {
    if (!rows.length) return "";
    var th = COLS.map(function (c) {
      var ok = c.sort !== false;
      var ar = S.sort === c.k ? '<span class="ar">' + (S.dir < 0 ? "▼" : "▲") + "</span>" : "";
      var ipucu = c.k === "yer" ? ' title="' + esc(YAS_NOT) + '"' : "";
      return '<th class="' + (ok ? "s" : "") + '"' + (ok ? ' data-sort="' + c.k + '" tabindex="0" role="button"' : "") +
        ipucu + ">" + esc(c.t) + ar + "</th>";
    }).join("");
    var tr = rows.map(function (d) {
      return '<tr class="' + (d.durum === "aday" ? "" : "sold") + '" data-key="' + esc(d.anahtar) + '">' +
        COLS.map(function (c) { return '<td class="' + (c.cls || "") + '">' + c.td(d) + "</td>"; }).join("") + "</tr>";
    }).join("");
    return '<div class="twrap"><table><thead><tr>' + th + "</tr></thead><tbody>" + tr + "</tbody></table></div>";
  }

  function kartHtml(rows) {
    return '<div class="cards">' + rows.map(function (d) {
      var foto = d.foto_url ? '<img src="' + esc(d.foto_url) + '" alt="" loading="lazy">' : '<div class="noimg">yok</div>';
      return '<div class="card' + (d.durum === "aday" ? "" : " sold") + '" data-key="' + esc(d.anahtar) + '">' +
        '<div class="card-top">' + foto +
          '<div class="card-hd"><span class="ad-name">' + esc(d.ad) + "</span>" +
          '<span class="ad-meta"><a href="' + esc(d.link) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">ilan ↗</a>' +
          (d.renk ? " · " + esc(d.renk) : "") + " · " + esc(bosluk(d.size)) + "</span>" +
          '<div style="margin-top:5px;display:flex;gap:5px;align-items:center;flex-wrap:wrap">' +
          '<span class="puan">' + d.puan.toFixed(1) + "</span>" +
          '<span class="pill ' + DURUM_SINIF[d.durum] + '">' + DURUM_ETIKET[d.durum] + "</span>" +
          guvenPill(d.guven) + "</div></div></div>" +
        '<div class="card-grid">' +
          '<div><span class="lbl">fiyat</span><div class="v">' + kr(d.toplam) + "</div></div>" +
          '<div><span class="lbl">değer</span><div class="v">' + kr(d.deger) + "</div></div>" +
          '<div><span class="lbl">fark</span><div class="v">' + farkHtml(d) + "</div></div>" +
          '<div><span class="lbl">mesafe</span><div class="v">' + km(d.mesafe) + "</div></div>" +
          '<div><span class="lbl">yer · gün</span><div class="v" style="font-size:11.5px">' +
            esc(bosluk(d.yer)) + (d.ilan_yas == null ? "" : " · " + d.ilan_yas + "g") + "</div></div>" +
          '<div><span class="lbl">vites</span><div class="v">' + esc(d.vites_n || "—") + "</div></div>" +
          '<div><span class="lbl">fren</span><div class="v" style="font-size:11.5px">' + esc(bosluk(d.fren)) + "</div></div>" +
        "</div>" +
        '<textarea class="yorum-box' + (d.yorum ? " dolu" : "") + '" style="margin-top:9px" rows="2" data-k="' +
          esc(d.anahtar) + '" placeholder="içgüdün ne diyor?" onclick="event.stopPropagation()">' + esc(d.yorum) + "</textarea>" +
        "</div>";
    }).join("") + "</div>";
  }

  function bolum(baslik, rows, ek) {
    if (!rows.length) return "";
    return '<div class="sec' + (ek || "") + '"><h2>' + esc(baslik) + '</h2><span class="cnt">' +
      rows.length + '</span><span class="rule"></span></div>' + tabloHtml(rows) + kartHtml(rows);
  }

  function ozet(rows) {
    var aday = BIKES.filter(function (d) { return d.profil === S.profil && d.durum === "aday"; });
    var best = aday.slice().sort(function (a, b) { return b.puan - a.puan; })[0];
    var firsat = aday.filter(function (d) { return d.fark != null; })
                     .sort(function (a, b) { return b.fark - a.fark; })[0];
    var eksikFoto = aday.filter(function (d) { return !d.foto_incelendi; }).length;
    var bekleyen = aday.filter(function (d) { return /CEVAP YOK|SORULMALI|durttu|bekliyor/i.test(d.son_temas || ""); }).length;
    function st(l, v, h) { return '<div class="stat"><span class="lbl">' + l + "</span><b>" + v + '</b><div class="hint">' + h + "</div></div>"; }
    return '<div class="summary">' +
      st("aday", aday.length, BIKES.filter(function (d) { return d.profil === S.profil; }).length + " kayıttan") +
      st("en yüksek puan", best ? best.puan.toFixed(1) : "—", best ? esc(best.ad.slice(0, 26)) : "") +
      st("en iyi fırsat", firsat && firsat.fark > 0 ? "+" + firsat.fark : "—",
         firsat && firsat.fark > 0 ? esc(firsat.ad.slice(0, 26)) : "değerin altında ilan yok") +
      st("fotoğrafı açılmamış", eksikFoto, "veri eksik") +
      st("cevap bekleyen", bekleyen, "satıcıdan") + "</div>";
  }

  function ciz() {
    var rows = sirala(suzulmus());
    var kisa = rows.filter(function (d) { return d.kisa && d.durum === "aday"; });
    var kalan = rows.filter(function (d) { return !(d.kisa && d.durum === "aday"); });
    var durumlar = [["aday", "aday"], ["hepsi", "hepsi"], ["vazgecildi", "vazgeçildi"], ["elendi", "elendi"], ["satildi", "satıldı"]];

    document.getElementById("app").innerHTML =
      "<header>" +
        '<div class="brand"><h1>Blocket Karar Tahtası</h1>' +
        '<span class="sub">puan bir gösterge değil, destek · son hüküm senin</span></div>' +
        '<div class="tabs" role="tablist">' +
          '<button class="tab" role="tab" data-profil="A" aria-selected="' + (S.profil === "A") + '">A — senin listen</button>' +
          '<button class="tab" role="tab" data-profil="B" aria-selected="' + (S.profil === "B") + '">B — eşinin listesi</button>' +
        "</div>" +
        '<div class="toolbar">' +
          '<input type="search" id="q" placeholder="ara: ad, renk, fren, satıcı, not…" value="' + esc(S.q) + '">' +
          durumlar.map(function (d) {
            return '<button class="chip" data-durum="' + d[0] + '" aria-pressed="' + (S.durum === d[0]) + '">' + d[1] + "</button>";
          }).join("") +
          '<span style="flex:1"></span><span id="save" class="savemsg"></span>' +
          (yerel && !NS ? '<button class="chip" id="disaAktar">yorumları dışa aktar</button>' : "") +
        "</div>" +
      "</header>" +
      ozet(rows) +
      bolum("Kısa liste — en idealler", kisa) +
      bolum(S.durum === "aday" ? "Diğer adaylar" : "Geçmiş ve arşiv", kalan, " arch") +
      "<footer>Kaynak: <code>bikes.csv</code> + <code>extra.json</code> · puan modeli <code>score.py</code> v4.3 · " +
      "yorum sütunu senindir · satır tıkla → tüm alanlar<br><b>Yer · gün</b>: " + esc(YAS_NOT) + "</footer>" +
      '<div class="drawer" id="drawer"><div class="scrim" data-close></div><div class="panel" id="panel"></div></div>';

    bagla();
    if (S.acik) detay(S.acik);
    kaydetUI();
  }

  /* ---------- detay cekmecesi ---------- */
  function detay(key) {
    var d = BIKES.filter(function (x) { return x.anahtar === key; })[0];
    if (!d) return;
    S.acik = key;
    function kv(pairs) {
      return '<dl class="kv">' + pairs.map(function (p) {
        return "<dt>" + esc(p[0]) + "</dt><dd>" + (p[2] ? p[1] : esc(bosluk(p[1]))) + "</dd>";
      }).join("") + "</dl>";
    }
    function grp(t, inner) { return '<div class="grp"><span class="lbl">' + t + "</span>" + inner + "</div>"; }

    document.getElementById("panel").innerHTML =
      '<button class="close" data-close aria-label="Kapat">✕</button>' +
      "<h3>" + esc(d.ad) + "</h3>" +
      '<div class="ad-meta" style="margin-top:4px"><a href="' + esc(d.link) + '" target="_blank" rel="noopener">blocket.se/' + esc(d.id) + " ↗</a> · profil " + d.profil + "</div>" +
      (d.foto_url ? '<img class="hero" src="' + esc(d.foto_url) + '" alt="">' : "") +
      grp("kararın", kv([
        ["Puan", '<span class="puan">' + d.puan.toFixed(1) + "</span> " +
          (d.kapsama < 100 ? '<span class="aralik">(' + d.alt.toFixed(0) + "–" + d.ust.toFixed(0) + " · veri %" + d.kapsama + ")</span>"
                           : '<span class="aralik">(kesin)</span>'), true],
        ["Fiyat", kr(d.toplam) + (d.ek_maliyet ? " (+" + d.ek_maliyet + " ek maliyet)" : "")],
        ["Değer (CC tahmini)", kr(d.deger)],
        ["Fark", farkHtml(d), true],
        ["Mesafe", km(d.mesafe)],
        ["Yer", d.yer],
        ["Güvenilirlik", guvenPill(d.guven), true],
        ["Satıcı", d.satici],
        ["Durum", '<span class="pill ' + DURUM_SINIF[d.durum] + '">' + DURUM_ETIKET[d.durum] + "</span>", true]
      ])) +
      grp("uyum", kv([["Beden", d.size], ["Kadro tipi", d.kadro_tip], ["Yıl", d.yil],
        ["Renk", d.renk], ["Kondisyon", d.kondisyon ? d.kondisyon + "/10" : ""],
        ["Bakım", d.bakim ? d.bakim + "/10" : ""], ["Ağırlık", d.agirlik]])) +
      grp("teknik", kv([["Vites tipi", d.vites_tip === "ic_gobek" ? "iç göbek" : d.vites_tip === "dis_aktarma" ? "dış aktarma" : d.vites_tip],
        ["Vites sayısı", d.vites_n], ["Vites seviyesi", d.vites_seviye],
        ["Fren", d.fren], ["Çatal", d.catal]])) +
      grp("donanım", kv([["Çamurluk", nokta(d.camurluk), true], ["Arka bagaj", nokta(d.bagaj), true],
        ["Sepet", nokta(d.sepet), true], ["Lamba", nokta(d.lamba), true],
        ["Sehpa", nokta(d.sehpa), true], ["Kilit", nokta(d.kilit), true],
        ["Zincir muhafazası", nokta(d.zincir_muhafaza), true],
        ["Çocuk koltuğu onayı", d.cocuk_onay]])) +
      grp("süreç", kv([["Son düzenlemeden beri", d.ilan_yas == null ? "" : d.ilan_yas + " gun (ilk yayin tarihi Blockette YOK)"],
        ["Fotoğraf", d.foto_incelendi ? "incelendi" : "AÇILMADI"],
        ["Son temas", d.son_temas],
        ["Ceza · mesafe", "−" + d.ceza_km.toFixed(1)],
        ["Ceza · bütçe", "−" + d.ceza_kr.toFixed(1)]])) +
      (d.eksik.length ? '<div class="eksik"><b>hâlâ bilinmiyor</b>' + esc(d.eksik.join(" · ")) + "</div>" : "") +
      grp("yorumun", '<textarea class="yorum-box" id="dy" rows="3" placeholder="içgüdün ne diyor? rasyonel olmak zorunda değil">' +
        esc(d.yorum) + "</textarea>" +
        '<div class="saveline"><button class="btn" id="dsave">Kaydet</button>' +
        '<span class="savemsg" id="dmsg"></span></div>') +
      grp("ölçüm notları", '<div class="notes">' + esc(d.not_tam || "—") + "</div>");

    document.getElementById("drawer").classList.add("open");
    var ta = document.getElementById("dy");
    document.getElementById("dsave").onclick = function () {
      yaz(d.anahtar, ta.value); yayinla(document.getElementById("dmsg"));
    };
  }

  /* ---------- yorum kaydi ---------- */
  function yaz(key, val) {
    var d = BIKES.filter(function (x) { return x.anahtar === key; })[0];
    if (!d || d.yorum === val) return false;
    d.yorum = val;
    if (val) YORUM[key] = val; else delete YORUM[key];
    kirli = true;
    return true;
  }

  // NOT: HTML etiketleri BILEREK parcali kuruluyor. Duz metin halinde
  // (duz belge metni olarak) yazildiginda yayin hatti bu inline
  // script'i hic calistirmiyordu (2026-08-29 teshisi).
  var LT = "<", GT = ">", SC = "script";
  function tag(ad, attr) { return LT + ad + (attr ? " " + attr : "") + GT; }
  function endTag(ad) { return LT + "/" + ad + GT; }
  function buildDoc() {
    var css = document.getElementById("appcss").textContent;
    var js = document.getElementById("appjs").textContent;
    var b = JSON.stringify(BIKES).replace(new RegExp(LT + "/", "g"), LT + "\\/");
    var y = JSON.stringify(YORUM).replace(new RegExp(LT + "/", "g"), LT + "\\/");
    return LT + "!doctype html" + GT + "\n" + tag("html", 'lang="tr"') + "\n" + tag("head") + "\n" +
      tag("meta", 'charset="utf-8"') + "\n" +
      tag("meta", 'name="viewport" content="width=device-width,initial-scale=1"') + "\n" +
      tag("title") + "Blocket Karar Tahtasi" + endTag("title") + "\n" +
      tag("style", 'id="appcss"') + css + endTag("style") + "\n" + endTag("head") + "\n" + tag("body") + "\n" +
      tag(SC, 'type="application/json" id="bikes"') + b + endTag(SC) + "\n" +
      tag(SC, 'type="application/json" id="yorum"') + y + endTag(SC) + "\n" +
      tag("div", 'id="app"') + endTag("div") + "\n" +
      tag(SC, 'id="appjs"') + js + endTag(SC) + "\n" + endTag("body") + "\n" + endTag("html");
  }

  function kaydetUI(msg, sinif) {
    var el = document.getElementById("save");
    if (!el) return;
    if (msg) { el.textContent = msg; el.className = "savemsg " + (sinif || ""); return; }
    if (NS)      { el.textContent = kirli ? "kaydedilmemiş değişiklik" : ""; el.className = "savemsg"; }
    else if (yerel) { el.textContent = kirli ? "kaydedilmemiş değişiklik" : "yorumlar bu cihaza kaydediliyor"; el.className = "savemsg"; }
    else         { el.textContent = "yorumlar kaydedilemiyor"; el.className = "savemsg err"; }
  }

  function yayinla(hedef) {
    if (!kirli) return;
    if (!NS) {
      var m1 = hedef || document.getElementById("save");
      if (yerel) {
        try {
          localStorage.setItem(LS, JSON.stringify(YORUM)); kirli = false;
          if (m1) { m1.textContent = "bu cihaza kaydedildi"; m1.className = "savemsg ok"; }
        } catch (e) {
          if (m1) { m1.textContent = "kaydedilemedi (depolama dolu)"; m1.className = "savemsg err"; }
        }
      } else if (m1) { m1.textContent = "kaydedilemedi — bu görünüm yazmaya izin vermiyor"; m1.className = "savemsg err"; }
      return;
    }
    var m = hedef || document.getElementById("save");
    if (m) { m.textContent = "kaydediliyor…"; m.className = "savemsg"; }
    NS.publish(buildDoc()).then(function () {
      kirli = false;
      if (m) { m.textContent = "kaydedildi"; m.className = "savemsg ok"; }
    })["catch"](function (e) {
      var c = e && e.code;
      if (m) {
        m.textContent = c === "conflict" ? "başka bir sekme daha önce kaydetti — sayfa yenilenecek"
                      : "kaydedilemedi (" + (c || "hata") + ")";
        m.className = "savemsg err";
      }
    });
  }

  function planla() {
    clearTimeout(zaman);
    zaman = setTimeout(function () { yayinla(null); }, 1400);
  }

  /* ---------- olay baglama ---------- */
  function bagla() {
    var app = document.getElementById("app");

    app.addEventListener("click", function (e) {
      var t = e.target;
      var tab = t.closest("[data-profil]");
      if (tab) { S.profil = tab.dataset.profil; S.acik = null; ciz(); return; }
      var ch = t.closest("[data-durum]");
      if (ch) { S.durum = ch.dataset.durum; ciz(); return; }
      var th = t.closest("[data-sort]");
      if (th) {
        if (S.sort === th.dataset.sort) S.dir = -S.dir;
        else { S.sort = th.dataset.sort; S.dir = -1; }
        ciz(); return;
      }
      if (t.id === "disaAktar") {
        var n = 0, txt = JSON.stringify(YORUM, null, 1);
        for (var q in YORUM) if (YORUM[q]) n++;
        window.prompt("Bu metni kopyala ve CC'ye ver — yorum.json'a islenir (" + n + " yorum):", txt);
        return;
      }
      if (t.closest("[data-close]")) { kapat(); return; }
      var row = t.closest("[data-key]");
      if (row && t.tagName !== "TEXTAREA" && t.tagName !== "A") detay(row.dataset.key);
    });

    app.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var th = e.target.closest("[data-sort]");
      if (th) { e.preventDefault(); th.click(); }
    });

    var q = document.getElementById("q");
    if (q) q.addEventListener("input", function () {
      S.q = q.value;
      var p = q.selectionStart; ciz();
      var n = document.getElementById("q"); if (n) { n.focus(); n.setSelectionRange(p, p); }
    });

    app.addEventListener("change", function (e) {
      if (!e.target.classList.contains("yorum-box")) return;
      var k = e.target.dataset.k; if (!k) return;
      if (yaz(k, e.target.value)) {
        e.target.classList.toggle("dolu", !!e.target.value);
        kaydetUI(); planla();
      }
    });
  }

  function kapat() {
    S.acik = null;
    var dr = document.getElementById("drawer");
    if (dr) dr.classList.remove("open");
    if (kirli) yayinla(null);
  }

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") kapat(); });

  // Font BLOKE ETMEDEN yuklenir: govdedeki <link rel=stylesheet> kendisinden sonraki
  // <script>'i de bekletir ve sandbox'ta sayfayi hic cizdirmiyordu. Once ciz, sonra font.
  function fontYukle() {
    if (document.getElementById("gf")) return;
    var l = document.createElement("link");
    l.id = "gf"; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700" +
      "&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap";
    (document.head || document.documentElement).appendChild(l);
  }

  try { ciz(); } catch (err) {
    var el = document.getElementById("app");
    if (el) el.textContent = "CIZIM HATASI: " + String(err && err.stack || err);
  }

  fontYukle();

  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (ns) { NS = ns; kaydetUI(); })
      ["catch"](function () { NS = null; kaydetUI(); });
  } else { kaydetUI(); }
})();
</script>
</body>
